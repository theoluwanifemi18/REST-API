services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: personal_api_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: nifemi_api_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U personal_api_user -d nifemi_api_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://personal_api_user:${DB_PASSWORD}@db/nifemi_api_db
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: